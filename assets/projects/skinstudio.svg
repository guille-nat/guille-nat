<text class="desc" x="32" y="150">Plataforma de turnos online para una clínica estética: carrito multi-turno, señas con MercadoPago, gift cards,</text><text class="desc" x="32" y="174">recordatorios automáticos y una agenda admin sincronizada con Google Calendar.</text>
