<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="">
<style>

.pulse { animation: pulse 3.5s ease-in-out infinite; }
@keyframes pulse { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0F172A"/>
</linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF00AA"/>
</linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FF00AA" stop-opacity="0"/><stop offset="0.5" stop-color="#FF00AA"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
</linearGradient></defs>
<rect x="0" y="11" width="1200" height="2" fill="#1E293B"/>
<rect class="pulse" x="0" y="10" width="200" height="4" rx="2" fill="url(#p)" filter="url(#glow)"/>

</svg>
